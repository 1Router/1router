services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onerouter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Keep the container's PostgreSQL port at 5432, but use 5433 on the host
    # so local installations can coexist with another PostgreSQL container.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - onerouter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onerouter"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  onerouter-postgres:
