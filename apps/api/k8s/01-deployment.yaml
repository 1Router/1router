apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: 1router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ghcr.io/1router/api:main
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: RUST_LOG
          value: "info"
        - name: BIND_ADDR
          value: "0.0.0.0:3001"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://1router.com,https://www.1router.com"
        - name: ROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: router-api-key
        # ── Provider API keys (set the ones you use) ──────────────────────
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: anthropic-api-key
              optional: true
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: google-api-key
              optional: true
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: xai-api-key
              optional: true
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: deepseek-api-key
              optional: true
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: groq-api-key
              optional: true
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: openrouter-api-key
              optional: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
