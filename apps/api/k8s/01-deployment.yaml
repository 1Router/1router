apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: 1router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ghcr.io/1router/api:main
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: RUST_LOG
          value: "info"
        - name: BIND_ADDR
          value: "0.0.0.0:3001"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://1router.com,https://www.1router.com"
        - name: ROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: router-api-key
        - name: ROUTER_IDENTITY_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: router-identity-secret
              optional: true
        # ── Provider API keys (set the ones you use) ──────────────────────
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: anthropic-api-key
              optional: true
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: google-api-key
              optional: true
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: xai-api-key
              optional: true
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: deepseek-api-key
              optional: true
        - name: QWEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: qwen-api-key
              optional: true
        - name: MISTRAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: mistral-api-key
              optional: true
        - name: PERPLEXITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: perplexity-api-key
              optional: true
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: nvidia-api-key
              optional: true
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: groq-api-key
              optional: true
        - name: MINIMAX_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: minimax-api-key
              optional: true
        - name: MOONSHOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: moonshot-api-key
              optional: true
        - name: STEPFUN_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: stepfun-api-key
              optional: true
        - name: ZAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: zai-api-key
              optional: true
        - name: ARK_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: ark-api-key
              optional: true
        - name: UPSTAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: upstage-api-key
              optional: true
        - name: ABACUS_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: abacus-api-key
              optional: true
        - name: SARVAM_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: sarvam-api-key
              optional: true
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: azure-openai-api-key
              optional: true
        - name: AZURE_OPENAI_ENDPOINT
          value: ""
        - name: AZURE_OPENAI_API_VERSION
          value: "2024-10-21"
        - name: STOCKMARK_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: stockmark-api-key
              optional: true
        - name: STOCKMARK_API_BASE
          value: ""
        - name: NEVERSLEEP_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: neversleep-api-key
              optional: true
        - name: NEVERSLEEP_API_BASE
          value: ""
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
