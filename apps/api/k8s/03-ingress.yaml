apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: 1router
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Increase proxy buffer/timeout for SSE streaming responses
    nginx.ingress.kubernetes.io/proxy-buffering: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.1router.com
    secretName: api-1router-tls
  rules:
  - host: api.1router.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
